name: Syntony CI

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -e '.[dev]'

      - run: sudo apt-get update && sudo apt-get install -y redis-server

      - run: make validate hygiene lint format-check test

      - run: make compose-check

      - name: Validate example configurations and Compose overrides
        run: |
          for config in config/service-resilience-*.json config/examples/*.json; do
            python -m runtime validate --config "$config"
          done
          for override in deployment/examples/local/*.compose.json; do
            docker compose -f deployment/examples/local/compose.json -f "$override" config --quiet
          done

      - name: Build module images and exercise adaptation
        run: make integration
