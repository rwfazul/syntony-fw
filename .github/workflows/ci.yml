name: Syntony CI

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -e '.[dev]'

      - run: sudo apt-get update && sudo apt-get install -y redis-server

      - run: make validate hygiene lint format-check test

      - run: make compose-check

      - run: python -m runtime validate --config config/service-resilience-host-guard.json

      - run: docker compose -f deployment/examples/local/compose.json -f deployment/examples/local/host-guard.compose.json config --quiet

      - name: Build module images and exercise adaptation
        run: make integration
