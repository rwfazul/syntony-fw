[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "syntony-fw"
version = "0.1.0"
readme = "README.md"
description = "Reference implementation of event-driven, multi-domain adaptive reconfiguration"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
# redis-py client version. The local Compose stack runs Redis Server 7.4.
dependencies = ["redis>=5.2,<6"]

[project.optional-dependencies]
dev = ["ruff==0.17.2"]

[project.scripts]
syntony = "runtime.__main__:main"

[tool.setuptools.packages.find]
include = ["runtime*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".local", "build", "dist", "generated", "*.egg-info"]

[tool.ruff.lint]
select = ["F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["runtime"]
