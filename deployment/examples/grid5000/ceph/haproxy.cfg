global
  log stdout format raw local0
  stats socket ipv4@0.0.0.0:9999 level admin
defaults
  mode http
  log global
  option httplog
  timeout connect 3s
  timeout client 60s
  timeout server 60s
frontend s3
  bind *:8080
  default_backend gateways
backend gateways
  balance roundrobin
  http-response set-header X-RGW-Backend %[srv_name]
  server rgw1 rgw1:8080 check inter 1s fall 3 rise 2
  server rgw2 rgw2:8080 check inter 1s fall 3 rise 2 disabled
